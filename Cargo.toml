[package]
name = "code-synthesizer"
version.workspace = true
rust-version.workspace = true
edition = "2024"

[workspace]
members = [
    ".",
    "crates/synth-core",
    "crates/synth-dsl",
    "crates/synth-vst3",
    "crates/synth-ui",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.3.2"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "forbid"

[dependencies]
synth-core = { path = "crates/synth-core" }
synth-dsl = { path = "crates/synth-dsl" }
