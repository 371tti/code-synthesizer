name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Check release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            cargo metadata --no-deps --format-version 1 |
            jq -r '.workspace_root as $root
              | .packages[]
              | select(.manifest_path == ($root + "/Cargo.toml"))
              | .version' |
            head -n 1
          )"

          if [ -z "$version" ] || [ "$version" = "null" ]; then
            version="$(
              cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[0].version'
            )"
          fi

          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not determine version"
            exit 1
          fi

          tag="v$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          echo "Version: $version"
          echo "Tag: $tag"

      - name: Check existing release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"

          if gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then
            echo "Release $tag already exists -> skip"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $tag does not exist -> build"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi


  build:
    name: Build VST3
    needs: plan

    if: needs.plan.outputs.should_release == 'true'

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install UI dependencies
        shell: pwsh
        run: |
          npm ci --prefix ui

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build VST3 bundle
        shell: pwsh
        run: |
          .\build.ps1

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package release asset
        shell: pwsh
        run: |
          $version = '${{ needs.plan.outputs.version }}'

          $bundle = 'target\bundled\Code Synthesizer.vst3'
          $asset = "code-synthesizer-v$version-windows-x64.zip"

          if (-not (Test-Path -LiteralPath $bundle)) {
            throw "VST3 bundle not found: $bundle"
          }

          Compress-Archive `
            -LiteralPath $bundle `
            -DestinationPath $asset `
            -Force

          if (-not (Test-Path -LiteralPath $asset)) {
            throw "Failed to create: $asset"
          }

          Write-Host "Created $asset"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-synthesizer-windows-x64
          path: code-synthesizer-v${{ needs.plan.outputs.version }}-windows-x64.zip
          if-no-files-found: error


  release:
    name: Create GitHub Release
    needs:
      - plan
      - build

    if: needs.plan.outputs.should_release == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: code-synthesizer-windows-x64
          path: release-assets

      - name: Show release files
        shell: bash
        run: |
          ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: Code Synthesizer ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.plan.outputs.version, '-') }}
          files: release-assets/*