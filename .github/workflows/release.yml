name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-CargoVersion([string]$Manifest) {
            $workspace = [regex]::Match(
              $Manifest,
              '(?ms)^\[workspace\.package\]\s*(.*?)(?=^\[|\z)'
            )

            if ($workspace.Success) {
              $match = [regex]::Match(
                $workspace.Groups[1].Value,
                '(?m)^\s*version\s*=\s*"([^"]+)"'
              )

              if ($match.Success) {
                return $match.Groups[1].Value
              }
            }

            $package = [regex]::Match(
              $Manifest,
              '(?ms)^\[package\]\s*(.*?)(?=^\[|\z)'
            )

            if ($package.Success) {
              $match = [regex]::Match(
                $package.Groups[1].Value,
                '(?m)^\s*version\s*=\s*"([^"]+)"'
              )

              if ($match.Success) {
                return $match.Groups[1].Value
              }
            }

            return $null
          }

          $version = Get-CargoVersion (
            Get-Content -LiteralPath Cargo.toml -Raw
          )

          if (-not $version) {
            throw 'Cargo.toml version was not found'
          }

          $tag = "v$version"

          & gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            $release = 'false'
            Write-Host "Release $tag already exists."
          }
          else {
            $release = 'true'
            Write-Host "Release $tag does not exist. Creating release."
          }

          "changed=$release" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install UI dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci --prefix ui

      - name: Verify
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        run: |
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build VST3 bundle
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        run: .\build.ps1

      - name: Package release asset
        if: steps.version.outputs.changed == 'true'
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $asset = "target\bundled\code-synthesizer-v$version-windows-x64.zip"
          Compress-Archive -LiteralPath 'target\bundled\Code Synthesizer.vst3' -DestinationPath $asset -Force
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $asset = '${{ steps.package.outputs.asset }}'
          $arguments = @(
            $tag,
            $asset,
            '--target', $env:GITHUB_SHA,
            '--title', "Code Synthesizer v$version",
            '--generate-notes'
          )
          if ($version.Contains('-')) { $arguments += '--prerelease' }
          & gh release create @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
